openapi: 3.1.0

info:
  title: External API
  description: Внешнее API антифрод-системы. Получает данные клиента из Online-витрины и принимает ML-модели от аналитиков.
  version: 1.0.0

servers:
  - url: https://first.bank.local/v1
    description: Основной сервер

tags:
  - name: Clients
    description: Данные о клиенте из внешнего источника
  - name: Models
    description: ML-модели от команды аналитиков

paths:

  /clients/{client_id}:
    get:
      summary: Получить данные клиента
      tags:
        - Clients
      parameters:
        - name: client_id
          in: path
          required: true
          description: ID клиента
          schema:
            type: string
            example: client_5267
      responses:
        '200':
          description: Данные клиента найдены
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                    example: client_5267
                  age:
                    type: integer
                    example: 19
                  geo:
                    type: string
                    example: RU-MOW
        '400':
          description: Неправильный ID клиента
        '404':
          description: Клиент не найден во внешнем источнике
        '500':
          description: Внешний источник недоступен

  /models:
    post:
      summary: Загрузить ML-модель
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - version
              properties:
                name:
                  type: string
                  example: fraud-detector
                version:
                  type: string
                  example: '1.4.2'
      responses:
        '201':
          description: Модель загружена и сохранена в S3/MinIO
        '400':
          description: Не хватает name или version
        '409':
          description: Такая версия модели уже есть
        '500':
          description: Не удалось сохранить модель

    get:
      summary: Получить список моделей
      tags:
        - Models
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: fraud-detector
                    version:
                      type: string
                      example: '1.4.2'
                    status:
                      type: string
                      example: active
        '500':
          description: Не удалось получить список моделей