name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loader
          POSTGRES_PASSWORD: test
          POSTGRES_DB: loader_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U loader -d loader_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/loader/requirements.txt
            services/enrichment/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r services/loader/requirements.txt -r services/enrichment/requirements.txt pytest
      - name: Run Loader, SCD2 and Enrichment tests
        env:
          LOADER_TEST_DATABASE_URL: "postgresql://loader:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/loader_test"
          REDIS_URL: "redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0"
          TEAM_API_KEY: test
          ABS_URL: http://127.0.0.1:1/abs
        run: |
          export DATABASE_URL="$LOADER_TEST_DATABASE_URL"
          export TEST_DATABASE_URL="$DATABASE_URL"
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              for migration in sorted(Path("db/migrations").glob("*.sql")):
                  conn.execute(migration.read_text(encoding="utf-8"))
          PY
          python scripts/dev.py test
          PYTHONPATH=services/enrichment:libs/common python -m pytest -q -rs services/enrichment/tests
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f compose.monitoring.yml config --quiet
      - name: Build service images
        run: docker compose build loader enrichment
