services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - ./minio/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-rest:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: uvicorn services.ml_service.main:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8001:8001"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml-grpc:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: python -m services.ml_service.grpc_server
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    ports:
      - "50051:50051"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=3); channel.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
