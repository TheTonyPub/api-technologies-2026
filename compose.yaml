services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - ./minio/minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-healthcheck:
    image: curlimages/curl:latest
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ml-rest:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: uvicorn services.ml_service.main:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8001:8001"
    depends_on:
      minio-healthcheck:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml-grpc:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: python -m services.ml_service.grpc_server
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    ports:
      - "50051:50051"
    depends_on:
      minio-healthcheck:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=3); channel.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  decision-service:
    build:
      context: .
      dockerfile: services/decision_service/Dockerfile
    command: python -m services.decision_service.server
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DECISION_GRPC_PORT=50052
    ports:
      - "50052:50052"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antifraud
      POSTGRES_USER: antifraud
      POSTGRES_PASSWORD: antifraud
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraud -d antifraud"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-service:
    build: ./services/sync_service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
