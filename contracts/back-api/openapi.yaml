openapi: 3.1.0
info:
  title: External API
  description: >-
    Внешнее API антифрод-системы. Получает данные клиента из Online-витрины и
    принимает ML-модели от аналитиков.
  version: 1.0.0
servers:
  - url: 'https://first.bank.local/v1'
    description: Основной сервер
tags:
  - name: Clients
    description: Данные о клиенте из внешнего источника
  - name: Models
    description: ML-модели от команды аналитиков
paths:
  '/clients/{client_id}':
    get:
      summary: Получить данные клиента
      tags:
        - Clients
      parameters:
        - name: client_id
          in: path
          required: true
          description: ID клиента
          schema:
            type: string
          examples:
            default:
              summary: Пример ID клиента
              value: client_5267
      responses:
        '200':
          description: Данные клиента найдены
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  age:
                    type: integer
                  geo:
                    type: string
              examples:
                success:
                  summary: Успешный ответ с данными клиента
                  value:
                    client_id: client_5267
                    age: 19
                    geo: RU-MOW
        '400':
          description: Неправильный ID клиента
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                bad_request:
                  summary: Пример ошибки 400
                  value:
                    error: Invalid client_id format
        '404':
          description: Клиент не найден во внешнем источнике
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  summary: Пример ошибки 404
                  value:
                    error: Client not found
        '500':
          description: Внешний источник недоступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                server_error:
                  summary: Пример ошибки 500
                  value:
                    error: External source unavailable
  /models:
    post:
      summary: Загрузить ML-модель
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - version
              properties:
                name:
                  type: string
                version:
                  type: string
            examples:
              new_model:
                summary: Пример загрузки новой модели
                value:
                  name: fraud-detector
                  version: 1.4.2
      responses:
        '201':
          description: Модель загружена и сохранена в S3/MinIO
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                created:
                  summary: Модель успешно создана
                  value:
                    status: Model uploaded successfully
        '400':
          description: Не хватает name или version
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                missing_fields:
                  summary: Пример ошибки 400
                  value:
                    error: 'Missing required fields: name, version'
        '409':
          description: Такая версия модели уже есть
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                conflict:
                  summary: Пример ошибки 409
                  value:
                    error: Model version 1.4.2 already exists
        '500':
          description: Не удалось сохранить модель
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                server_error:
                  summary: Пример ошибки 500
                  value:
                    error: Failed to save model to storage
    get:
      summary: Получить список моделей
      tags:
        - Models
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                    status:
                      type: string
              examples:
                model_list:
                  summary: Пример списка моделей
                  value:
                    - name: fraud-detector
                      version: 1.4.2
                      status: active
                    - name: fraud-detector
                      version: 1.3.0
                      status: archived
        '500':
          description: Не удалось получить список моделей
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                server_error:
                  summary: Пример ошибки 500
                  value:
                    error: Internal server error
