openapi: 3.1.0

info:
  title: ML Service API
  description: >-
    API ML-сервиса антифрода. Получает признаки клиента от сервиса статистики,
    прогоняет через модель и отдает скор. Модели лежат в S3, сервис их подтягивает
    при старте. Сам решение не выносит — это делает отдельный контейнер "Решение".
  version: 1.0.0

servers:
  - url: 'https://ml-service.anti-fraud.local/v1'
    description: Основной сервер

tags:
  - name: Inference
    description: Инференс модели (получение скора)
  - name: Models
    description: Список моделей (только чтение, они в S3)

paths:
  /inference/check:
    post:
      summary: Получить скор по признакам
      tags:
        - Inference
      description: >-
        Принимает признаки клиента от статистики, применяет модель и возвращает скор.
        Решение (BLOCKED/APPROVED) принимает уже сервис "Решение".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
            examples:
              test_features:
                summary: Пример признаков
                value:
                  transaction_id: "tx_98765"
                  client_id: "client_5267"
                  features:
                    avg_amount_30d: 12500.75
                    tx_count_24h: 3
                    geo_risk: 0.15
                    merchant_risk: 0.05
      responses:
        '200':
          description: Скор от модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
              examples:
                high_risk:
                  summary: Высокий риск
                  value:
                    transaction_id: "tx_98765"
                    score: 0.98
                    check_details:
                      tool: "fraud-detector"
                      version: "1.4.2"
                      action: "Inference"
                      actual_result: "Fraud probability > 0.9"
                low_risk:
                  summary: Низкий риск
                  value:
                    transaction_id: "tx_98765"
                    score: 0.05
                    check_details:
                      tool: "fraud-detector"
                      version: "1.4.2"
                      action: "Inference"
                      actual_result: "Fraud probability < 0.1"
        '400':
          description: Что-то не так с признаками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Пример 400
                  value:
                    error: "Invalid features data"
        '500':
          description: Внутренняя ошибка (модель не загрузилась и т.п.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Пример 500
                  value:
                    error: "ML model not loaded"

  /models:
    get:
      summary: Список моделей
      tags:
        - Models
      description: Показывает, какие модели лежат в S3 и доступны для инференса.
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'
              examples:
                model_list:
                  summary: Пример списка
                  value:
                    - name: "fraud-detector"
                      version: "1.4.2"
                      status: "active"
                    - name: "fraud-detector"
                      version: "1.3.0"
                      status: "archived"
        '500':
          description: Не получилось отдать список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Пример 500
                  value:
                    error: "Failed to fetch model list"

components:
  schemas:
    InferenceRequest:
      type: object
      required:
        - transaction_id
        - client_id
        - features
      properties:
        transaction_id:
          type: string
          description: ID транзакции
        client_id:
          type: string
          description: ID клиента
        features:
          type: object
          description: Признаки клиента
          required:
            - avg_amount_30d
            - tx_count_24h
          properties:
            avg_amount_30d:
              type: number
              format: float
              description: Средняя сумма за 30 дней
            tx_count_24h:
              type: integer
              description: Сколько транзакций за сутки
            geo_risk:
              type: number
              format: float
              description: Гео-риск
            merchant_risk:
              type: number
              format: float
              description: Риск мерчанта

    InferenceResponse:
      type: object
      properties:
        transaction_id:
          type: string
        score:
          type: number
          format: float
          description: Скор от модели (0..1)
        check_details:
          type: object
          description: Детали проверки
          properties:
            tool:
              type: string
              description: Модель
            version:
              type: string
              description: Версия
            action:
              type: string
              description: Действие
            actual_result:
              type: string
              description: Результат

    ModelInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [active, archived]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Текст ошибки
