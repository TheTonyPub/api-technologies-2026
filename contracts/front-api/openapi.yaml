openapi: 3.1.0

info:
  title: ML Service API
  description: >-
    Это API нашего ML-сервиса, который проверяет транзакции. 
    Он берет данные, прогоняет через модель и выдает вердикт. 
    Сами модели лежат в S3, сервис их оттуда подтягивает при старте.
  version: 1.0.0

servers:
  - url: 'https://ml-service.anti-fraud.local/v1'
    description: Основной сервер

tags:
  - name: Inference
    description: Проверка транзакций (инференс)
  - name: Models
    description: Список моделей (только чтение, они в S3)

paths:
  /inference/check:
    post:
      summary: Проверить транзакцию
      tags:
        - Inference
      description: >-
        Получает данные транзакции от АБС, применяет модель и возвращает решение.
        В ответе пишу, какая модель использовалась и что она показала.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
            examples:
              new_transaction:
                summary: Пример транзакции
                value:
                  transaction_id: "tx_98765"
                  client_id: "client_5267"
                  amount: 15000.50
                  currency: "RUB"
                  merchant_id: "shop_001"
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
              examples:
                fraud_detected:
                  summary: Пример, где сработала модель
                  value:
                    transaction_id: "tx_98765"
                    status: "BLOCKED"
                    risk_score: 0.98
                    reason: "High risk transaction pattern"
                    check_details:
                      tool: "fraud-detector"
                      version: "1.4.2"
                      action: "Inference"
                      actual_result: "Fraud probability > 0.9"
                legit_transaction:
                  summary: Пример одобренной транзакции
                  value:
                    transaction_id: "tx_98765"
                    status: "APPROVED"
                    risk_score: 0.05
                    reason: "Normal behavior"
                    check_details:
                      tool: "fraud-detector"
                      version: "1.4.2"
                      action: "Inference"
                      actual_result: "Fraud probability < 0.1"
        '400':
          description: Ошибка в данных транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Пример ошибки 400
                  value:
                    error: "Invalid transaction data"
        '500':
          description: Внутренняя ошибка (например, модель не загружена)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Пример ошибки 500
                  value:
                    error: "ML model not loaded"
  /models:
    get:
      summary: Получить список моделей
      tags:
        - Models
      description: Возвращает модели, которые лежат в S3 и доступны для инференса.
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'
              examples:
                model_list:
                  summary: Пример списка
                  value:
                    - name: "fraud-detector"
                      version: "1.4.2"
                      status: "active"
                    - name: "fraud-detector"
                      version: "1.3.0"
                      status: "archived"
        '500':
          description: Не удалось получить список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Пример ошибки 500
                  value:
                    error: "Failed to fetch model list"

components:
  schemas:
    # Что присылает АБС
    InferenceRequest:
      type: object
      required:
        - transaction_id
        - client_id
        - amount
        - currency
      properties:
        transaction_id:
          type: string
          description: ID транзакции
        client_id:
          type: string
          description: ID клиента
        amount:
          type: number
          format: float
          description: Сумма
        currency:
          type: string
          description: Валюта (ISO 4217)
        merchant_id:
          type: string
          description: ID магазина

    InferenceResponse:
      type: object
      properties:
        transaction_id:
          type: string
        status:
          type: string
          enum: [APPROVED, BLOCKED, REVIEW]
        risk_score:
          type: number
          format: float
          description: Оценка риска от 0 до 1
        reason:
          type: string
          description: Причина решения
        check_details:
          type: object
          description: Детали проверки
          properties:
            tool:
              type: string
              description: Инструмент (модель)
            version:
              type: string
              description: Версия
            action:
              type: string
              description: Действие
            actual_result:
              type: string
              description: Результат

    ModelInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [active, archived]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Текст ошибки
