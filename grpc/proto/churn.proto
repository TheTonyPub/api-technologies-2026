syntax = "proto3";

package homework.v1;

// Сервис оценки риска оттока клиента (та же предметная область, что и в REST).
service ChurnService {
  // Unary: один запрос -> один ответ.
  rpc Predict (PredictRequest) returns (Prediction);
  // Server streaming: один запрос -> поток ответов.
  rpc PredictHistory (HistoryRequest) returns (stream Prediction);
  // Client streaming: поток запросов -> один ответ.
  rpc PredictBatch (stream PredictRequest) returns (BatchSummary);
  // Bidirectional streaming: поток запросов <-> поток ответов.
  rpc PredictLive (stream PredictRequest) returns (stream Prediction);
}

message PredictRequest {
  string customer_id = 1;
  int32 tenure_months = 2;
  double monthly_spend = 3;
  int32 support_tickets = 4;
}

message HistoryRequest {
  string customer_id = 1;
  int32 months = 2;
  double monthly_spend = 3;
  int32 support_tickets = 4;
}

message Prediction {
  string customer_id = 1;
  int32 tenure_months = 2;
  double risk_score = 3;
  string risk_label = 4;
}

message BatchSummary {
  int32 total = 1;
  int32 high_risk_count = 2;
  double average_risk = 3;
}